# Builds the website and publishes it to GitHub Pages on every push to main.
# The site is fully static: web/dist is what gets published. The atlas data in
# web/public/data/ is committed, so no Python step is needed here.
# Action versions and inputs checked against their action.yml on 2026-11-22.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

# Allow publishing to Pages (and nothing else)
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; a newer push replaces a waiting one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # LTS; Vitest 5 needs >= 22.12
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci # exact versions from package-lock.json
      - run: npm test # do not publish if scoring or lookup tests fail
      - run: npm run build # type check + Vite build → web/dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
